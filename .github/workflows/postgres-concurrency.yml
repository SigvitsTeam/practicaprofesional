name: PostgreSQL concurrency QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-concurrency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-concurrency:
    name: Isolated ITS1 and ITS2 transaction races
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: sigvits_qa_concurrency
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-qa-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sigvits_qa_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      QA_DATABASE_URL: postgresql://postgres:ci-only-qa-password@127.0.0.1:5432/sigvits_qa_concurrency
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies and generate client
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run db:generate
      - name: Prepare roles required by institutional migrations in isolated QA
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql --no-psqlrc --set ON_ERROR_STOP=1 -U postgres -d sigvits_qa_concurrency <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          SQL
      - name: Apply migrations only to the disposable QA database
        run: DIRECT_URL="$QA_DATABASE_URL" DATABASE_URL="$QA_DATABASE_URL" npm run db:migrate:deploy
      - name: Verify safety guards and real transaction interleavings
        run: npm run test:postgres:qa -- --ci --json --outputFile=postgres-concurrency-results.json
      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-concurrency-results
          path: backend/postgres-concurrency-results.json
          if-no-files-found: warn
          retention-days: 30
