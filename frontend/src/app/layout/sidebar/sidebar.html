<aside class="sidebar">
  <div class="brand"><div class="brand-mark">S+</div><div><strong>SIGVITS</strong><span>Vigilancia en salud</span></div></div>
  <nav aria-label="Navegación principal">
    <p class="nav-label">OPERACIÓN</p>
    @for (item of items('Operación'); track item.label) {<button class="nav-item" [class.active]="active() === item.label" (click)="navigate.emit(item.label)"><span class="nav-icon">{{ item.icon }}</span>{{ item.label }}@if (countFor(item.label); as count) {<span class="nav-count">{{ count }}</span>}</button>}
    <p class="nav-label nav-second">GESTIÓN</p>
    @for (item of items('Gestión'); track item.label) {<button class="nav-item" [class.active]="active() === item.label" (click)="navigate.emit(item.label)"><span class="nav-icon">{{ item.icon }}</span>{{ item.label }}</button>}
  </nav>
  <div class="privacy-card"><span>●</span><div><strong>{{ role().privacyLabel }}</strong><p>{{ role().privacyDetail }}</p></div></div>
</aside>
