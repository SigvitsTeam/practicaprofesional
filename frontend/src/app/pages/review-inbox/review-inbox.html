<section class="review-summary"><div><span>En revisión</span><strong>{{ count('En revisión') }}</strong><i class="blue-dot"></i></div><div><span>Aprobados</span><strong>{{ count('Aprobado') }}</strong><i class="green-dot"></i></div><div><span>Devueltos</span><strong>{{ count('Devuelto') }}</strong><i class="red-dot"></i></div><div><span>Pendientes</span><strong>{{ count('Pendiente') }}</strong><i class="amber-dot"></i></div></section>
<article class="panel review-panel"><div class="table-toolbar"><div><strong>{{ scopeDescription }}</strong><small> · Datos agregados del período</small></div><label class="search">⌕<input [(ngModel)]="search" [placeholder]="'Buscar ' + entityLabel.toLowerCase() + '…'"></label><div><select><option>Todos los estados</option><option>En revisión</option><option>Aprobado</option></select><button class="btn secondary" (click)="notify.emit('Tabla exportada para revisión.')">↓ Exportar</button></div></div><app-report-table [reports]="reports" [entityLabel]="entityLabel" (reportSelected)="reportSelected.emit($event)" /></article>
