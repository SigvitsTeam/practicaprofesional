<section class="review-summary"><div><span>En revisión</span><strong>{{ count('En revisión') }}</strong><i class="blue-dot"></i></div><div><span>Aprobados</span><strong>{{ count('Aprobado') }}</strong><i class="green-dot"></i></div><div><span>Devueltos</span><strong>{{ count('Devuelto') }}</strong><i class="red-dot"></i></div><div><span>Pendientes</span><strong>{{ count('Pendiente') }}</strong><i class="amber-dot"></i></div></section>
@if (loading()) {<section class="inbox-message">Cargando reportes ITS-2…</section>}
@if (loadError()) {<section class="inbox-message error">{{ loadError() }} <button class="btn secondary" (click)="reload()">Reintentar</button></section>}
<article class="panel review-panel"><div class="table-toolbar"><div><strong>{{ scopeDescription }}</strong><small> · Datos agregados del período</small></div><label class="search">⌕<input [(ngModel)]="search" [placeholder]="'Buscar ' + entityLabel.toLowerCase() + '…'"></label>@if (isDemo) {<div><select><option>Todos los estados</option><option>En revisión</option><option>Aprobado</option></select><button class="btn secondary" (click)="notify.emit('Exportación disponible en el módulo Reportes y exportaciones.')">↓ Exportar</button></div>}</div><app-report-table [reports]="reports" [entityLabel]="entityLabel" (reportSelected)="reportSelected.emit($event)" /></article>
