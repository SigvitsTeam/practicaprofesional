<section
  class="establishment-selector"
  [attr.aria-label]="readOnlyView() ? 'Contexto de consulta ITS 2' : 'Contexto de digitación'"
>
  <div class="selector-icon">＋</div>
  <div class="selector-copy">
    <strong>Establecimiento activo</strong
    ><span>{{
      readOnlyView()
        ? 'Consulta preliminar ITS 2 dentro del alcance autorizado.'
        : 'La captura y el ITS 2 se registrarán para este establecimiento.'
    }}</span>
  </div>
  <label
    ><span>Seleccione un establecimiento autorizado</span
    ><select (change)="changeEstablishment($event)">
      @for (item of context.establishments; track item.code) {
        <option [value]="item.code" [selected]="item.code === context.selectedCode()">
          {{ item.name }} · {{ item.code }}
        </option>
      }
    </select></label
  >
</section>
